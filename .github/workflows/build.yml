
name: Build PlayerRadar

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build Minecraft Mod
        working-directory: PlayerRadar-26.3
        run: gradle build

      - name: Upload Minecraft Mod
        uses: actions/upload-artifact@v4
        with:
          name: PlayerRadar-26.3
          path: PlayerRadar-26.3/build/libs/*.jar
          if-no-files-found: error
